name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Маленький exe: нужен установленный .NET 8 Desktop Runtime.
      - name: Publish (small)
        run: dotnet publish src/RAMFlow/RAMFlow.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/small

      # Всё в одном: работает без установки .NET.
      - name: Publish (portable)
        run: dotnet publish src/RAMFlow/RAMFlow.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/portable

      - name: Rename
        shell: pwsh
        run: |
          Move-Item out/small/RAMFlow.exe out/RAMFlow.exe
          Move-Item out/portable/RAMFlow.exe out/RAMFlow-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RAMFlow
          path: |
            out/RAMFlow.exe
            out/RAMFlow-portable.exe

      # Каждый push в main — новый релиз v1.0.<номер сборки>; тег создаёт сам GitHub.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RAM Flow v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **RAMFlow.exe** — маленький, нужен [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0).
            **RAMFlow-portable.exe** — работает без установки .NET.

            Запускается от имени администратора: без этого Windows не даёт чистить системную память.
          files: |
            out/RAMFlow.exe
            out/RAMFlow-portable.exe
